# Archon example configuration file
# Copy to ~/.archon/config.toml and edit as needed.
# All settings have defaults — only add what you want to override.

# ── Global ────────────────────────────────────────────────────────────────────
debug             = false   # verbose debug logging to terminal
safe_mode         = false   # require confirmation before destructive ops
continue_on_error = false   # keep going in batch mode after a failure
# log_file = "/var/log/archon.jsonl"   # write structured JSON logs to file

# ── AI ────────────────────────────────────────────────────────────────────────
# Archon runs entirely against a local Ollama server; no API key is required.
[ai]
ollama_url   = "http://127.0.0.1:11434"   # or OLLAMA_URL env var
ollama_model = "qwen3.5:9b"               # or OLLAMA_MODEL env var

# Leave model blank to use ollama_model above.
model       = ""

max_tokens  = 8000   # sliding-window context budget (tokens)
timeout     = 30     # per-request timeout in seconds
max_retries = 3      # retries on transient failures
retry_delay = 2.0    # exponential back-off base delay (seconds)

# ── n8n ───────────────────────────────────────────────────────────────────────
[n8n]
url     = "http://localhost:5678"
api_key = ""   # or N8N_API_KEY env var

default_error_webhook    = ""   # POST errors to this webhook (leave blank to disable)
polling_interval_seconds = 5

# ── Distro Builder ────────────────────────────────────────────────────────────
[distro_builder]
work_dir                  = "/tmp/archon_distro_build"
output_dir                = "./distro_output"
default_jobs              = 0                           # 0 = auto from nproc
debian_mirror             = "http://deb.debian.org/debian"
debian_suite              = "bookworm"
kernel_cache_dir          = "~/.archon/kernel_cache"
require_root_confirmation = true
