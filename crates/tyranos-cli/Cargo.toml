[package]
name = "tyranos-cli"
version = "0.1.0"
edition = "2021"
description = "Rust CLI binary for Tyranos — fast cold-start alternative to Python CLI"

[[bin]]
name = "tyranos-bin"
path = "src/main.rs"

[dependencies]
tyranos-core = { path = "../tyranos-core" }
clap = { version = "4", features = ["derive", "cargo"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
indicatif = "0.17"
dialoguer = "0.11"
colored = "2"
anyhow = "1"
