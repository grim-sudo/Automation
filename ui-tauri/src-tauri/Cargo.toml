[package]
name = "archon-tauri"
version = "2.0.0"
description = "Archon GUI — Tauri backend"
authors = ["Archon Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                    = { version = "2", features = ["devtools"] }
tauri-plugin-shell       = "2"
tauri-plugin-notification = "2"
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
tokio                    = { version = "1", features = ["full"] }
anyhow                   = "1"

# Reuse archon-core for config + validation
archon-core = { path = "../../crates/archon-core" }
