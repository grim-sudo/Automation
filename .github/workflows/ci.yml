name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Linting (ruff) ──────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.3.0"

      - name: Ruff lint check
        run: ruff check omni_automator/ omni.py tests/ --output-format=github

      - name: Ruff format check
        run: ruff format --check omni_automator/ omni.py tests/

  # ─── Type checking (mypy) ────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies + mypy
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" \
            mypy>=1.9.0 \
            types-requests \
            types-PyYAML \
            types-send2trash

      - name: Run mypy
        run: |
          mypy omni_automator/ omni.py \
            --ignore-missing-imports \
            --no-error-summary \
            --warn-return-any
        continue-on-error: true

  # ─── Tests (pytest) ──────────────────────────────────────────────────────────
  test:
    name: Test (pytest) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --asyncio-mode=auto \
            --cov=omni_automator \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -m "not integration and not slow"
        env:
          OPENROUTER_API_KEY: test-key-for-ci
          OPENAI_API_KEY: test-key-for-ci
          ANTHROPIC_API_KEY: test-key-for-ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report-py312
          path: coverage.xml
          retention-days: 14

  # ─── Build + package validation ──────────────────────────────────────────────
  build:
    name: Build & validate package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install build twine hatchling

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─── Summary gate ─────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ needs.lint.result }}"      != "success" ||
                "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.test.result }}"      != "success" ||
                "${{ needs.build.result }}"     != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
