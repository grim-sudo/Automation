name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Linting (ruff) ──────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.3.0"

      - name: Ruff lint check
        run: ruff check tyranos/ tyranos.py tests/ --output-format=github

      - name: Ruff format check
        run: ruff format --check tyranos/ tyranos.py tests/

  # ─── Type checking (mypy) ────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies + mypy
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" \
            mypy>=1.9.0 \
            types-requests \
            types-PyYAML \
            types-send2trash

      - name: Run mypy
        run: |
          mypy tyranos/ \
            --ignore-missing-imports \
            --no-error-summary \
            --warn-return-any
        continue-on-error: true

  # ─── Tests (pytest) ──────────────────────────────────────────────────────────
  test:
    name: Test (pytest) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --asyncio-mode=auto \
            --cov=tyranos \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -m "not integration and not slow"
        env:
          OPENROUTER_API_KEY: test-key-for-ci
          OPENAI_API_KEY: test-key-for-ci
          ANTHROPIC_API_KEY: test-key-for-ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report-py312
          path: coverage.xml
          retention-days: 14

  # ─── Build + package validation ──────────────────────────────────────────────
  build:
    name: Build & validate package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install build twine hatchling

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─── Rust — build, clippy, test ──────────────────────────────────────────────
  rust:
    name: Rust (build + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo build (debug)
        run: cargo build --workspace

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo build (release)
        run: cargo build --release --package tyranos-cli

      - name: Benchmark cold-start (< 80 ms target)
        run: |
          BIN=./target/release/tyranos-bin
          START=$(date +%s%3N)
          $BIN version || true
          END=$(date +%s%3N)
          ELAPSED=$((END - START))
          echo "Cold-start: ${ELAPSED}ms"
          if [ "$ELAPSED" -gt 500 ]; then
            echo "WARNING: cold-start ${ELAPSED}ms exceeds 500ms informational threshold"
          fi

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: tyranos-bin-linux-x86_64
          path: target/release/tyranos-bin
          retention-days: 7

  # ─── Tauri GUI — TypeScript check + Rust cargo check ─────────────────────────
  tauri:
    name: Tauri GUI (tsc + cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('ui-tauri/package-lock.json') }}
          restore-keys: |
            npm-

      - name: Install npm dependencies
        working-directory: ui-tauri
        run: npm install

      - name: TypeScript type check
        working-directory: ui-tauri
        run: npx tsc --noEmit

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (Tauri)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui-tauri/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('ui-tauri/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tauri-

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cargo check (Tauri backend)
        working-directory: ui-tauri/src-tauri
        run: cargo check

  # ─── Summary gate ─────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    needs: [lint, typecheck, test, build, rust, tauri]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ needs.lint.result }}"      != "success" ||
                "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.test.result }}"      != "success" ||
                "${{ needs.build.result }}"     != "success" ||
                "${{ needs.rust.result }}"      != "success" ||
                "${{ needs.tauri.result }}"     != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
